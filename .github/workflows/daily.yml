name: Descarga diaria de datos

on:
  schedule:
    # Lunes a viernes. GitHub usa hora UTC; dos horarios para cubrir el cambio de hora de EE. UU.
    # 21:20 UTC = 16:20 Nueva York en invierno; 20:20 UTC = 16:20 Nueva York en verano.
    # El script no hace nada si la sesion aun no ha cerrado o ya estaba descargada.
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
    - cron: "50 21 * * 1-5"   # reintento por si GitHub retrasa la ejecucion
  workflow_dispatch:          # permite lanzarlo a mano desde la pestana Actions
    inputs:
      force:
        description: "Forzar descarga aunque ya exista"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerias
        run: pip install pandas requests

      - name: Descargar datos
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python fetch_data.py --force
          else
            python fetch_data.py
          fi

      - name: Guardar en el repositorio
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos de mercado $(date -u +%Y-%m-%d)"
            git push
          fi
